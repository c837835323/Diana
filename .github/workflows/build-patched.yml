name: Build patched Diana

# 手动触发：填上游版本号，拉 SuInk/diana 对应 tag 的源码，套 patches/ 下的补丁，
# 跑相关测试，编译 diana-webui，再以官方同版本镜像为底替换主程序，推到 ghcr。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "上游版本 tag，例如 v0.8.150"
        required: true
        type: string
      push_image:
        description: "推送镜像到 ghcr.io（不勾只编译、只上传二进制）"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: build-patched-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号格式应为 vX.Y.Z，收到：$VERSION"
            exit 1
          fi

      - name: Checkout patches
        uses: actions/checkout@v4
        with:
          path: patches-repo

      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: SuInk/diana
          ref: ${{ inputs.version }}
          path: src

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Apply patches
        working-directory: src
        run: |
          shopt -s nullglob
          patches=(../patches-repo/patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "::error::patches/ 里没有补丁，直接用官方镜像即可，无需编译"
            exit 1
          fi
          for patch in "${patches[@]}"; do
            echo "== $patch"
            git apply --verbose "$patch"
          done

      - name: Targeted tests
        working-directory: src
        run: go test ./model/assistant/ -run 'RSSWatch|Bilibili' -count=1

      - name: Build diana-webui
        working-directory: src
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p ../out
          go build -trimpath -ldflags="-s -w -X main.buildVersion=${VERSION}" -o ../out/diana-webui ./cmd/webui

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: diana-webui-${{ inputs.version }}-patched
          path: out/diana-webui
          retention-days: 7

      - name: Write Dockerfile
        run: |
          cat > out/Dockerfile <<EOF
          FROM ghcr.io/suink/diana:${VERSION}
          COPY --chmod=0755 diana-webui /app/diana-webui
          EOF

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/diana" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        if: ${{ inputs.push_image }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: out
          platforms: linux/amd64
          push: ${{ inputs.push_image }}
          tags: ${{ steps.image.outputs.name }}:${{ inputs.version }}-patched
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Diana ${{ inputs.version }} + local patches (bilibili wbi/view, X feed images)
